services:
  - type: web
    name: smart-agriculture-api
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: WEATHER_API_KEY
        value: bd5e378503939ddaee76f12ad7a97608
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
